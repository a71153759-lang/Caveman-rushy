(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;const id=await u.id();if(!id)return;
const ref=d.collection('data/users/'+id).doc('save'),sn=await ref.get();

cloud=ref;usrNS=u;dbNS=d;lbRef=d.collection('lb').doc(id);if(!sn.exists)persist();else lbPush()}catch(e){}})();
const cost={inc:l=>Math.round(15*1.6**l),add:l=>Math.round(30*1.8**l),up:l=>Math.round(25*1.7**l),cap:l=>Math.round(40*1.9**l)};
const capMax=()=>3+save.cap*2,rnd=(a,b)=>a+Math.random()*(b-a);

function genRun(){
 const L=save.lvl,LEN=1600+Math.min(L,10)*120,obs=[];let z=260;
 const gv=k=>k==='ft'?1+Math.floor(rnd(0,2)):Math.round(rnd(10,30)),KS=['fr','rg','ft'];
 while(z<LEN-150){const r=Math.random();
  if(r<.18){const a=rnd(.4,.7),k1=KS[Math.floor(rnd(0,3))],k2=KS[Math.floor(rnd(0,3))];obs.push({t:'g',k:k1,x:-a,z,v:gv(k1)},{t:'g',k:k2,x:a,z,v:gv(k2)})}

  else if(r<.93){const cx=rnd(-.5,.5);for(let j=0;j<8;j++)obs.push({t:'c',x:cx+Math.sin(j*.6)*.3,z:z+j*14})}

  z+=rnd(140,200)}
 const EI=(L-1)%5===2?eraIdx():-1,EVN=['Dinosaur Boss Fight','Tornado Alley','Meteorite Crash','Robot Guardian','Jungle Stampede','Sugar Rush','Lightning Storm','Alien UFO Boss','Cannon Barrage','Giant Octopus Boss','Dragon Boss','Steam Vents'];let evBoss=false;
 if(EI===0){obs.push({t:'e',boss:1,dino:1,mv:14,x:0,z:LEN-140,hp:60+L*8,m:0});evBoss=true}
 else if(EI===1){for(let j=0;j<3;j++)obs.push({t:'tw',x:0,z:LEN*.45+j*170,ph:j*2.1})}
 else if(EI===2){obs.push({t:'m',x:rnd(-.4,.4),z:LEN*.5})}
 else if(EI===3){obs.push({t:'e',boss:1,mech:1,mv:12,x:0,z:LEN-140,hp:70+L*8,m:0});evBoss=true}
 else if(EI===4){for(let j=0;j<14;j++){const d=j%2?1:-1;obs.push({t:'st',x:-d*1.5,z:LEN*.35+j*50,dir:d,spd:.7+rnd(0,.5)})}}
 else if(EI===5){obs.push({t:'u',k:'rush',x:0,z:LEN*.4});for(let j=0;j<5;j++)for(let k=0;k<10;k++)obs.push({t:'c',x:Math.sin(k*.5+j)*.55,z:LEN*.4+40+j*130+k*14})}
 else if(EI===6){for(let j=0;j<14;j++)obs.push({t:'lt',x:rnd(-.8,.8),z:LEN*.35+j*70})}
 else if(EI===7){obs.push({t:'e',boss:1,ufo:1,mv:12,sw:1,x:0,z:LEN-140,hp:80+L*8,m:0});evBoss=true}
 else if(EI===8||EI===11){for(let j=0;j<14;j++)obs.push({t:'lt',kind:EI===8?'cannon':'steam',x:rnd(-.8,.8),z:LEN*.35+j*70})}
 else if(EI===9){obs.push({t:'e',boss:1,octo:1,mv:12,sw:1,x:0,z:LEN-140,hp:90+L*8,m:0});evBoss=true}
 else if(EI===10){obs.push({t:'e',boss:1,drag:1,mv:13,x:0,z:LEN-140,hp:100+L*8,m:0});evBoss=true}
 if(L%3===0&&!evBoss)obs.push({t:'e',boss:1,x:0,z:LEN-110,hp:25+L*6,m:0});
 for(let r=0;r<6;r++)for(let c=0;c<5;c++)obs.push({t:'b',x:-.8+c*.4,z:LEN+r*16,hp:4+L*2+r*L+Math.floor(rnd(0,L+3))});
 S={ev:EI>=0?{k:EI,n:EVN[EI]}:null,evOK:true,z:0,LEN,obs,bul:[],fr:100,rg:100,fighters:Math.min(1+save.add,capMax()),coins:0,cd:0,wall:0};
}
function P(x,z){const d=Math.max(z-S.z,-40),s=1/(1+d/500);return{x:W/2+x*s*W*.42,y:H*.82-(1-s)*H*1.1,s}}
function end(w){won=w;if(w&&S.ev&&S.evOK&&S.ev.k!==0&&S.ev.k!==3&&S.ev.k!==7&&S.ev.k!==9&&S.ev.k!==10){S.coins+=60+10*save.lvl}if(w)[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.08),i*110));else{beep(150,.5,'sawtooth',.08);vib(200)}document.getElementById('rv').style.display=(!w&&!S.revived)?'block':'none';mode=w?'win':'lose';reward=Math.floor(S.coins*(1+.25*save.inc))+10*save.lvl;S.bonus=0;if(w&&S.perfect){S.bonus=Math.floor(reward*.5)+50*save.lvl;reward+=S.bonus}if(!w)reward=Math.floor(reward/2);if(dblNext)reward*=2;reward=Math.floor(reward*(1+.25*eraIdx()));
 document.getElementById('wt').textContent=w?'VICTORY!':'DEFEATED';document.getElementById('wr').innerHTML='🪙 '+reward+(S.bonus?'<div style="font-size:13px;color:#e0a020">⭐ WALL CLEARED BONUS +'+S.bonus+'</div>':'');

let AC=null;

function update(dt){
 if(mode!=='play')return;
